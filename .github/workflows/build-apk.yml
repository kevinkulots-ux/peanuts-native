name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh ninja-build cmake python3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install NDK 28.2.13676358 & CMake
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Build ondevice stage
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          sed -i 's/\r$//' android/ondevice/build.sh
          mkdir -p "$RUNNER_TEMP/work"
          zsh android/ondevice/build.sh "$RUNNER_TEMP/work" all

          # Compile _nxyaz0 C extension required by build.gradle
          CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang"
          INC="$RUNNER_TEMP/work/py/include/python3.14"
          S="$RUNNER_TEMP/work/stage"
          if [ -f peanuts/pack/worker/nxyaz0.c ]; then
            $CC -shared -fPIC -O2 -I"$INC" -I"$S/lib/lz4" -L"$S/lib" -lpython3.14 -Wl,-z,max-page-size=16384 \
              peanuts/pack/worker/nxyaz0.c \
              -o "$S/python/lib/python3.14/lib-dynload/_nxyaz0.cpython-314-aarch64-linux-android.so"
          fi

      - name: Use Google Maven Mirror
        run: |
          find android/app -maxdepth 2 \( -name "settings.gradle*" -o -name "build.gradle*" \) -exec sed -i 's|mavenCentral()|maven { url = uri("https://googleapis.com") }|g' {} +

      - name: Build Launcher APK
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$PATH"
          echo "sdk.dir=$ANDROID_HOME" > android/app/local.properties
          echo "ndk.dir=$ANDROID_NDK_HOME" >> android/app/local.properties
          cd android/app
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 -PnxPackStage="$RUNNER_TEMP/work/stage" apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: peanuts-native-jumpforce-apk
          path: android/app/nxnative/**/*.apk
          if-no-files-found: error
