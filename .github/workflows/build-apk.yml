name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply Dore's PR #890 (Jump Force 60 FPS & UE4.22 Pak Fix)
        run: |
          git checkout -f HEAD
          curl -sL https://github.com -o /tmp/890.patch
          git apply --3way /tmp/890.patch || patch -p1 --forward < /tmp/890.patch || true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh ninja-build cmake python3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle & NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}

      - name: Install NDK 28.2.13676358 & CMake
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Build ondevice stage (python + tools + zbic)
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          sed -i 's/\r$//' android/ondevice/build.sh
          mkdir -p "$RUNNER_TEMP/work"
          zsh android/ondevice/build.sh "$RUNNER_TEMP/work" python
          zsh android/ondevice/build.sh "$RUNNER_TEMP/work" tools
          zsh android/ondevice/build.sh "$RUNNER_TEMP/work" zbic

          # Auto-locate Python.h and nxyaz0.c to compile _nxyaz0.cpython-314-aarch64-linux-android.so
          CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang"
          PY_H=$(find "$RUNNER_TEMP/work" -name "Python.h" | head -n 1)
          INC=$(dirname "$PY_H")
          S="$RUNNER_TEMP/work/stage"
          NXYAZ0_SRC=$(find . -name "nxyaz0.c" | head -n 1)
          echo "Using Python headers at: $INC"
          $CC -shared -fPIC -O2 -I"$INC" -I"$S/lib/lz4" -L"$S/lib" -lpython3.14 -Wl,-z,max-page-size=16384 \
            "$NXYAZ0_SRC" \
            -o "$S/python/lib/python3.14/lib-dynload/_nxyaz0.cpython-314-aarch64-linux-android.so"

      - name: Use Google Maven Mirror & Fix Missing Icon
        run: |
          find android/app -maxdepth 2 \( -name "settings.gradle*" -o -name "build.gradle*" \) -exec sed -i 's|mavenCentral()|maven { url = uri("https://googleapis.com") }|g' {} +
          mkdir -p android/app/src/main/res/drawable
          if [ ! -f android/app/src/main/res/drawable/ic_close.xml ]; then
            cat << 'EOF' > android/app/src/main/res/drawable/ic_close.xml
          <vector xmlns:android="http://android.com"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M19,6.41L17.59,5 12,10.59 6.41,5 5,6.41 10.59,12 5,17.59 6.41,19 12,13.41 17.59,19 19,17.59 13.41,12z"/>
          </vector>
          EOF
          fi

      - name: Build Launcher APK (Jump Force 60 FPS Only)
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          echo "sdk.dir=$ANDROID_HOME" > android/app/local.properties
          echo "ndk.dir=$ANDROID_NDK_HOME" >> android/app/local.properties

          sed -i 's/cFlags /cFlags "-g0", "-Os", /g' android/app/build.gradle 2>/dev/null || true

          cd android/app
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=4 -PnxPackStage="$RUNNER_TEMP/work/stage" -PnxGames=0100183010F12000 apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: peanuts-native-jumpforce-apk
          path: android/app/out/*.apk
          if-no-files-found: error
