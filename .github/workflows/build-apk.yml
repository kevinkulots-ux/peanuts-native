name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install NDK 28.2.13676358 & CMake
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Build ondevice stage
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
        run: |
          mkdir -p "$RUNNER_TEMP/work"
          chmod +x android/ondevice/build.sh
          android/ondevice/build.sh "$RUNNER_TEMP/work"

      - name: Build Launcher APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/app/local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> android/app/local.properties
          cd android/app
          chmod +x gradlew
          ./gradlew -PnxPackStage="$RUNNER_TEMP/work/stage" apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: peanuts-native-jumpforce-apk
          path: android/app/nxnative/**/*.apk
          if-no-files-found: error
